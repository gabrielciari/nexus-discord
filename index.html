<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS Discord</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090b10;color:#f4f5f7}
button,input{font:inherit}
button{cursor:pointer;border:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #20242d;background:#0d1017;position:sticky;top:0;z-index:5}
.logo{font-weight:900;letter-spacing:.12em}
.badge{font-size:12px;color:#7ee787}
.wrap{max-width:1100px;margin:auto;padding:28px 18px}
.card{background:#11151d;border:1px solid #242a35;border-radius:18px;padding:20px;margin-bottom:18px}
h1,h2{margin-top:0}
.muted{color:#9aa3b2}
.btn{padding:11px 15px;border-radius:10px;background:#5865f2;color:white;font-weight:700}
.btn.secondary{background:#202633}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.server{padding:18px;border:1px solid #282e39;border-radius:14px;background:#0d1118}
.server button{width:100%;margin-top:12px}
.editor{display:grid;grid-template-columns:280px 1fr;gap:18px}
@media(max-width:700px){.editor{grid-template-columns:1fr}}
input{width:100%;background:#0a0d13;border:1px solid #303744;color:white;padding:12px;border-radius:10px;margin:7px 0}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input{margin:0}
.item{background:#0c1016;border:1px solid #252b35;border-radius:12px;padding:12px;margin:8px 0}
.channel{margin-left:18px;color:#b8c0ce}
.empty{text-align:center;padding:45px;color:#8e98a8}
.danger{color:#ff7b72}
</style>
</head>
<body>
<header class="top">
  <div class="logo">NEXUS</div>
  <div id="userArea"><span class="badge">● OFFLINE</span></div>
</header>

<main class="wrap">
  <section id="login" class="card" style="display:none">
    <h1>Construa seu servidor pelo navegador.</h1>
    <p class="muted">Conecte sua conta Discord e use o NEXUS para criar a estrutura do servidor.</p>
    <a class="btn" href="/auth/login">Entrar com Discord</a>
  </section>

  <section id="app" style="display:none">
    <div class="card">
      <h1>Servidor Builder</h1>
      <p class="muted">Escolha um servidor e monte categorias e canais.</p>
      <div id="servers" class="grid"></div>
    </div>

    <div id="builder" class="card" style="display:none">
      <div class="editor">
        <aside>
          <h2>Estrutura</h2>
          <input id="categoryName" placeholder="Nome da categoria">
          <button class="btn" onclick="addCategory()">+ Categoria</button>
          <button class="btn secondary" onclick="applyBuild()" style="margin-top:8px">Aplicar no Discord</button>
          <button class="btn secondary" onclick="loadStructure()" style="margin-top:8px">Atualizar</button>
        </aside>
        <section>
          <h2 id="selectedTitle">Meu servidor</h2>
          <div id="tree"></div>
        </section>
      </div>
    </div>
  </section>
</main>

<script>
let state={guild:null,categories:[]};

async function init(){
  const r=await fetch('/api/me');
  if(!r.ok){document.getElementById('login').style.display='block';return;}
  const data=await r.json();
  document.getElementById('app').style.display='block';
  document.getElementById('userArea').innerHTML=`<span>${escapeHtml(data.user.username)}</span> · <a href="/auth/logout" style="color:#9aa3b2">sair</a>`;
  renderServers(data.guilds);
}

function renderServers(guilds){
  const el=document.getElementById('servers');
  if(!guilds.length){el.innerHTML='<div class="empty">Nenhum servidor gerenciável encontrado.</div>';return;}
  el.innerHTML=guilds.map(g=>`
    <div class="server">
      <strong>${escapeHtml(g.name)}</strong>
      <p class="muted">${g.botInstalled?'🤖 Bot instalado':'⚠️ Bot não instalado'}</p>
      <button class="btn" ${g.botInstalled?'':'disabled'} onclick="selectGuild('${g.id}','${escapeAttr(g.name)}')">
        ${g.botInstalled?'Configurar':'Instale o bot primeiro'}
      </button>
    </div>`).join('');
}

async function selectGuild(id,name){
  state.guild={id,name};
  document.getElementById('builder').style.display='block';
  document.getElementById('selectedTitle').textContent=name;
  await loadStructure();
}

async function loadStructure(){
  if(!state.guild)return;
  const r=await fetch('/api/guild/'+state.guild.id+'/structure');
  if(!r.ok){alert('Não foi possível carregar o servidor.');return;}
  const data=await r.json();
  state.categories=data.categories.map(c=>({
    name:c.name,
    channels:c.children.map(x=>({name:x.name,type:x.type===2?'voice':'text'}))
  }));
  renderTree();
}

function addCategory(){
  const input=document.getElementById('categoryName');
  const name=input.value.trim();
  if(!name)return;
  state.categories.push({name,channels:[]});
  input.value='';
  renderTree();
}

function addChannel(index){
  const name=prompt('Nome do canal:');
  if(!name)return;
  state.categories[index].channels.push({name,type:'text'});
  renderTree();
}

function renderTree(){
  const tree=document.getElementById('tree');
  if(!state.categories.length){
    tree.innerHTML='<div class="empty">Nenhuma categoria criada ainda.</div>';return;
  }
  tree.innerHTML=state.categories.map((c,i)=>`
    <div class="item">
      <div class="row">
        <strong>📁 ${escapeHtml(c.name)}</strong>
        <button class="btn secondary" onclick="addChannel(${i})">+ canal</button>
      </div>
      ${c.channels.map(x=>`<div class="channel"># ${escapeHtml(x.name)}</div>`).join('')||'<div class="muted">Sem canais</div>'}
    </div>`).join('');
}

async function applyBuild(){
  if(!state.guild||!state.categories.length){alert('Crie pelo menos uma categoria.');return;}
  if(!confirm('Isso criará uma nova estrutura no Discord. Continuar?'))return;
  const r=await fetch('/api/guild/'+state.guild.id+'/build',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:state.guild.name,categories:state.categories})
  });
  const data=await r.json();
  if(!r.ok){alert(data.error||'Erro ao aplicar.');return;}
  alert(`Aplicado! ${data.created.length} itens criados.`);
  await loadStructure();
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function escapeAttr(s){return String(s).replace(/'/g,"&#039;");}
init();
</script>
</body>
</html>
